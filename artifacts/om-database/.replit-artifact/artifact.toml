kind = "web"
previewPath = "/"
title = "KPR Centers OM Database"
version = "1.0.0"
id = "artifacts/om-database"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19661

[services.development]
run = "pnpm --filter @workspace/om-database run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/om-database", "run", "build" ]
publicDir = "artifacts/om-database/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19661"
BASE_PATH = "/"
